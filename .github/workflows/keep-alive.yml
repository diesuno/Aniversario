name: Mantener viva la app de Streamlit

on:
  schedule:
    # Se ejecuta todos los lunes y jueves a las 10:00 AM (UTC)
    - cron: '0 10 * * 1,4'
  workflow_dispatch: 
    # Esto te permite ejecutar el script manualmente desde GitHub con un botón

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer ping a la web
        run: curl -s https://aniversario.streamlit.app/ > /dev/null
